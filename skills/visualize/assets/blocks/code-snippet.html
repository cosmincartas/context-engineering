<section class="section code-section" aria-labelledby="{{BLOCK_ID}}-title">
  <div class="section-heading">
    <span class="index" aria-hidden="true">{{SECTION_NUMBER_ESCAPED}}</span>
    <div>
      <p class="eyebrow">Source excerpt</p>
      <h2 id="{{BLOCK_ID}}-title">{{HEADING_ESCAPED}}</h2>
      <p>{{PURPOSE_FROM_SOURCE_ESCAPED}}</p>
    </div>
  </div>
  <div class="code-card">
    <div class="code-head">
      <code>{{SOURCE_PATH_AND_LINES_ESCAPED}}</code>
      <span>{{LANGUAGE_OR_FORMAT_ESCAPED}}</span>
    </div>
    <pre tabindex="0" aria-label="Source excerpt from {{SOURCE_PATH_ESCAPED}}"><code>{{ESCAPED_SOURCE_TEXT}}</code></pre>
  </div>
  <p class="source-note">{{SOURCE_REVISION_AND_EXECUTION_EVIDENCE_ESCAPED}}</p>
</section>
